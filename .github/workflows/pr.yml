name: QtSDL PR Builder
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        build_type: [Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0

    - name: Install SDL3 (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl3-dev

    - name: Install SDL3 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install sdl3

    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Windows'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'win64_mingw'
        tools: 'tools_mingw1310'
        cache: true
        aqtversion: '==3.2.*'

    - name: Install Qt (Linux)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        aqtversion: '==3.2.*'

    - name: Install Qt (macOS)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'macOS'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        aqtversion: '==3.2.*'

    - name: Set SDL3 include path (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "SDL3_DIR=/usr/lib/x86_64-linux-gnu/cmake/SDL3" >> $GITHUB_ENV

    - name: Set SDL3 include path (macOS)
      if: runner.os == 'macOS'
      run: |
        # Get SDL3 installation prefix from Homebrew
        SDL3_PREFIX=$(brew --prefix sdl3)
        echo "SDL3_DIR=${SDL3_PREFIX}/lib/cmake/SDL3" >> $GITHUB_ENV

    - name: Set build output directory
      id: strings
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DQTSDL_TESTS=ON
        -DQTSDL_EXAMPLE=ON
        -DQTSDL_DEPENDS=ON
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DQTSDL_TESTS=ON
        -DQTSDL_EXAMPLE=ON
        -DQTSDL_DEPENDS=OFF
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }};${{ env.SDL3_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DQTSDL_TESTS=ON
        -DQTSDL_EXAMPLE=ON
        -DQTSDL_DEPENDS=OFF
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }};${{ env.SDL3_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16

    - name: Run unit tests
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16 --target test

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.os }}
        path: ${{ github.workspace }}/Testing/*/test_report.txt*
        if-no-files-found: ignore
