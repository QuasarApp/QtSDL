name: QtSDL PR Builder
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        build_type: [Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0

    - name: Install SDL3 (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        # SDL3 is built from the vendored submodule when QTSDL_DEPENDS=ON
        # No SDL3_DIR needed as SDL3 will be built from source

    - name: Install SDL3 (macOS)
      if: runner.os == 'macOS'
      run: |
        # SDL3 is built from the vendored submodule when QTSDL_DEPENDS=ON
        # No SDL3_DIR needed as SDL3 will be built from source

    - name: Install Qt (Windows)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Windows'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'win64_mingw'
        tools: 'tools_mingw1310'
        cache: true
        aqtversion: '==3.2.*'

    - name: Install Qt (Linux)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'Linux'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        aqtversion: '==3.2.*'

    - name: Install Qt (macOS)
      uses: jurplel/install-qt-action@v4.3.0
      if: runner.os == 'macOS'
      with:
        version: '6.10.3'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        aqtversion: '==3.2.*'

    - name: Set build output directory
      id: strings
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install CQtDeployer (Linux)
      if: runner.os == 'Linux'
      run: |
        # Note: Requires sudo privileges for installation
        wget -qO /tmp/cqtdeployer.sh https://github.com/QuasarApp/CQtDeployer/releases/download/v1.7.110.23b47c17/CQtDeployer_1.7.110.23b47c17_Linux_x86_64.run
        chmod +x /tmp/cqtdeployer.sh
        sudo /tmp/cqtdeployer.sh --accept-license
        echo "/opt/CQtDeployer/bin" >> $GITHUB_PATH

    - name: Install CQtDeployer (macOS)
      if: runner.os == 'macOS' && runner.arch == 'arm64'
      run: |
        # CQtDeployer is only available for Apple Silicon
        curl -L -o /tmp/CQtDeployer.zip "https://github.com/QuasarApp/CQtDeployer/releases/download/v1.7.110.23b47c17/CQtDeployer_1.7.110.23b47c17_Darwin_arm64.zip"
        unzip -q /tmp/CQtDeployer.zip -d /tmp/CQtDeployer
        echo "/tmp/CQtDeployer" >> $GITHUB_PATH

    - name: Install CQtDeployer (Windows)
      if: runner.os == 'Windows'
      run: |
        # Note: Requires admin privileges for silent installation
        Invoke-WebRequest -Uri "https://github.com/QuasarApp/CQtDeployer/releases/download/v1.7.110.23b47c17/CQtDeployer_1.7.110.23b47c17_Windows_AMD64.exe" -OutFile "CQtDeployer.exe"
        Start-Process -FilePath "CQtDeployer.exe" -ArgumentList "/S" -Wait
        echo "C:\Program Files\CQtDeployer\bin" >> $env:GITHUB_PATH

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DQTSDL_TESTS=ON
        -DQTSDL_EXAMPLE=ON
        -DQTSDL_DEPENDS=ON
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DQTSDL_TESTS=ON
        -DQTSDL_EXAMPLE=ON
        -DQTSDL_DEPENDS=ON
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DBUILD_SHARED_LIBS=ON
        -DQTSDL_TESTS=ON
        -DQTSDL_EXAMPLE=ON
        -DQTSDL_DEPENDS=ON
        -DCMAKE_PREFIX_PATH='${{ env.QT_ROOT_DIR }}'
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16

    - name: Run unit tests
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16 --target test

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.os }}
        path: |
          ${{ github.workspace }}/Testing/**/test_report.txt*
          ${{ github.workspace }}/build/Testing/**/test_report.txt*
          ${{ github.workspace }}/Testing/**/CTestTestfile.cmake
        if-no-files-found: ignore
